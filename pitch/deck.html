<title>AQYL Pitch Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=PT+Sans+Narrow:wght@400;700&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   AQYL — питч-дек.

   Дек набран как исправленная тетрадь.

   В постсоветской школе красная паста — инструмент, которым отмечают
   ошибку. Весь тезис продукта в том, что мы находим ошибку, которую
   никто не отметил. Отсюда единственное правило палитры:

       КРАСНЫМ ОТМЕЧАЕТСЯ ТОЛЬКО ДИАГНОЗ.

   Первопричина, пробел, то, чего ещё нет, и утверждение, ради которого
   сделан слайд. Всё, что работает, не получает цвета вообще — ровно как
   в проверенной тетради верный ответ остаётся без пометки. Красный здесь
   не акцент и не украшение: это следующий смысловой слой после чернил.

   Наборная пара: Oswald (узкая гротесковая, плакатная) на заголовках
   и PT Serif (ParaType, делался под государственную типографику и потому
   несёт казахский родным) на тексте. Засечный текст под узким гротеском
   читается как учебник — то есть как предмет разговора.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  /* Бумага: манильный, сероватый — не кремовый */
  --stock:      #e9e4d6;
  --stock-2:    #e2dccb;

  /* Чернила: плотный чёрно-коричневый, не чистый чёрный */
  --ink:        #191712;
  --ink-soft:   #6b655a;
  --ink-faint:  #948d7d;

  /* Линовка тетради */
  --rule:       #c6bfab;
  --rule-hard:  #a49c86;

  /* Красная паста. Холодноватая, чтобы не читалась терракотой */
  --red:        #c0201a;
  --red-soft:   #d8695f;

  --display: 'Oswald', 'Arial Narrow', sans-serif;
  --text:    'PT Serif', Georgia, serif;
  --note:    'PT Sans Narrow', 'Arial Narrow', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--ink);
  color: var(--ink);
  font-family: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.deck { display: grid; gap: 30px; padding: 30px 30px 96px; }

/* ─── Лист ────────────────────────────────────────────────────────────
   Жёсткие 16:9. Всё внутри считается от --u, чтобы кегли держали
   пропорцию и на ноутбуке докладчика, и с проектора. */
.sheet {
  position: relative;
  width: min(1280px, 96vw);
  aspect-ratio: 16 / 9;
  margin-inline: auto;
  background: var(--stock);
  color: var(--ink);
  padding: calc(var(--u) * 3.2) calc(var(--u) * 3.6) calc(var(--u) * 2.4);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  --u: clamp(9px, 1.05vw, 14px);
}

/* Оборот листа — чёрная плашка. Ритмический знак препинания, а не тема:
   так выделены только три удара дека — инсайт, преимущество и финал. */
.sheet.rev { background: var(--ink); color: var(--stock); }
.sheet.rev { --rule: #3a352b; --rule-hard: #55503f; --ink-soft: #a8a192; --ink-faint: #7d7768; --red: #e04a3c; }

/* ─── Типографика ───────────────────────────────────────────────────── */
h1, h2 {
  font-family: var(--display);
  font-weight: 600;
  line-height: .95;
  letter-spacing: -.005em;
  text-transform: uppercase;
  text-wrap: balance;
}
h1 { font-size: calc(var(--u) * 4.6); }
h2 { font-size: calc(var(--u) * 3.1); }
h3 {
  font-family: var(--display); font-weight: 500; text-transform: uppercase;
  font-size: calc(var(--u) * 1.28); line-height: 1.1; letter-spacing: .005em;
}

p { font-size: calc(var(--u) * 1.02); }
.lead { font-size: calc(var(--u) * 1.24); line-height: 1.44; max-width: 54ch; }
.small { font-size: calc(var(--u) * .92); line-height: 1.42; color: var(--ink-soft); }

strong { font-weight: 700; }
/* Красным — только диагноз. См. шапку файла. */
em { font-style: normal; color: var(--red); font-weight: 700; }
.mark { color: var(--red); }

/* Подчёркивание красной пастой.
   Через background-position штрих ложился по центру прописных и читался
   как зачёркивание — то есть ровно наоборот по смыслу. text-decoration
   считает отступ от собственной базовой линии шрифта и держится на любом
   кегле, в том числе на пятикратном заголовке. */
.u {
  text-decoration: underline;
  text-decoration-color: var(--red);
  text-decoration-thickness: .055em;
  text-underline-offset: .14em;
  text-decoration-skip-ink: none;
}

/* Пометка на полях — красная, рукописного тона за счёт курсива */
.margin-note {
  font-family: var(--text); font-style: italic; font-weight: 700;
  color: var(--red); font-size: calc(var(--u) * .92); line-height: 1.32;
}

/* Служебная подпись: узкий гротеск, без разрядки в капслоке */
.note {
  font-family: var(--note); font-size: calc(var(--u) * .82);
  color: var(--ink-faint); line-height: 1.32;
}
.note-b { font-family: var(--note); font-size: calc(var(--u) * .88); color: var(--ink-soft); }

/* Рубрика слайда — курсивная засечная, а не разряженный моноширинный капслок */
.rubric {
  font-family: var(--text); font-style: italic;
  font-size: calc(var(--u) * 1.02); color: var(--ink-soft);
}
.rubric::after { content: ''; display: block; width: calc(var(--u) * 2.6); height: 2px; background: var(--red); margin-top: calc(var(--u) * .5); }

.head { margin-bottom: calc(var(--u) * 1.7); }
.head h2 { margin-top: calc(var(--u) * .85); }
.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
/* .row объявлен ниже и ставит display:grid, поэтому у .row.grow центровка
   флексом молча не работала — содержимое собиралось вверху, а нижняя
   половина листа оставалась пустой. Растягиваем строку на всю высоту:
   колонки тянутся, вертикальная линовка идёт от края до края. */
.row.grow { display: grid; align-content: stretch; }
.row.grow > * { min-height: 0; }
/* Внутри колонки содержимое центрируется по вертикали, а линейка при этом
   всё равно проходит на всю высоту листа. */
.ruled.grow > * { display: flex; flex-direction: column; justify-content: center; }

/* ─── Колонтитул: как подпись под таблицей в учебнике ───────────────── */
.colophon {
  margin-top: auto; padding-top: calc(var(--u) * .8);
  border-top: 1px solid var(--rule);
  display: flex; align-items: baseline; gap: calc(var(--u) * 1.2);
  font-family: var(--note); font-size: calc(var(--u) * .8); color: var(--ink-faint);
}
.plate { font-family: var(--display); font-weight: 500; color: var(--ink-soft); letter-spacing: .04em; }
.colophon .sp { flex: 1; }

/* ─── Сетка ─────────────────────────────────────────────────────────── */
.row { display: grid; gap: calc(var(--u) * 2.6); }
.g-2 { grid-template-columns: 1fr 1fr; }
.g-3 { grid-template-columns: repeat(3, 1fr); }
.g-4 { grid-template-columns: repeat(4, 1fr); }
.g-wide-l { grid-template-columns: 7fr 5fr; }
.g-wide-r { grid-template-columns: 5fr 7fr; }
.stack { display: grid; align-content: start; }

/* Вертикальная линовка между колонками — вместо карточек */
.ruled > * + * { border-left: 1px solid var(--rule); padding-left: calc(var(--u) * 1.9); }
.ruled { gap: calc(var(--u) * 1.9); }

/* Горизонтальная линовка — строки тетради */
.lines > * { padding: calc(var(--u) * .78) 0; border-bottom: 1px solid var(--rule); }
.lines > *:first-child { border-top: 1px solid var(--rule); }

/* ─── Крупные числа ─────────────────────────────────────────────────── */
.fig { font-family: var(--display); font-weight: 600; line-height: .84; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.fig-xl { font-size: calc(var(--u) * 5.2); }
.fig-l  { font-size: calc(var(--u) * 3.4); }
.fig-m  { font-size: calc(var(--u) * 2.3); }
.fig.mark { color: var(--red); }

/* ─── Спуск по графу: главный разворот ──────────────────────────────
   Глубина закодирована отступом: каждый следующий уровень сдвинут вправо,
   потому что он лежит ниже. Красным помечен только последний — тот самый
   диагноз, ради которого всё и затевалось. */
.descent { display: grid; gap: 0; }
.level { display: grid; grid-template-columns: auto 1fr auto; align-items: baseline;
  gap: calc(var(--u) * 1.1); padding: calc(var(--u) * 1.25) 0; border-bottom: 1px solid var(--rule); }
.level:first-child { border-top: 1px solid var(--rule); }
.level.d1 { margin-left: 0; }
.level.d2 { margin-left: calc(var(--u) * 3.4); }
.level.d3 { margin-left: calc(var(--u) * 6.8); border-bottom: 2px solid var(--red); }
.level .lv { font-family: var(--display); font-weight: 500; font-size: calc(var(--u) * 1.05); color: var(--ink-faint); width: calc(var(--u) * 1.6); }
.level .name { font-family: var(--display); font-weight: 500; text-transform: uppercase; font-size: calc(var(--u) * 1.34); }
.level .why { font-family: var(--text); font-size: calc(var(--u) * .92); color: var(--ink-soft); margin-top: calc(var(--u) * .18); }
.level .pc { font-family: var(--display); font-weight: 600; font-size: calc(var(--u) * 2.1); font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.level.d3 .name, .level.d3 .pc { color: var(--red); }
.level.d3 .lv { color: var(--red); }

/* ─── Определения: термин и значение по линованной строке ───────────── */
.defs { display: grid; }
.def { display: grid; grid-template-columns: 1fr auto; gap: calc(var(--u) * 1.2);
  align-items: baseline; padding: calc(var(--u) * .72) 0; border-bottom: 1px solid var(--rule); }
.def:first-child { border-top: 1px solid var(--rule); }
.def dt { font-family: var(--text); font-size: calc(var(--u) * 1.02); }
.def dd { font-family: var(--note); font-size: calc(var(--u) * .92); color: var(--ink-soft); text-align: right; white-space: nowrap; }
.def.hit dt { font-weight: 700; }
.def.hit dd { color: var(--red); font-weight: 700; }

/* ─── Веса рекомендации — набором в строку, без пилюль ──────────────── */
.weights { font-family: var(--note); font-size: calc(var(--u) * .98); line-height: 1.9; }
.weights span { white-space: nowrap; }
.weights b { color: var(--red); font-weight: 700; font-variant-numeric: tabular-nums; }
.weights .sep { color: var(--rule-hard); margin: 0 calc(var(--u) * .5); }

/* ─── Полоса освоения: тонкая, печатная ─────────────────────────────── */
.meter { height: calc(var(--u) * .34); background: var(--stock-2); box-shadow: inset 0 0 0 1px var(--rule); }
.sheet.rev .meter { background: #2a271f; box-shadow: inset 0 0 0 1px var(--rule); }
.meter > i { display: block; height: 100%; background: var(--red); }

/* ─── Формулы: на линованной строке, без плашек ─────────────────────── */
.formulas { display: grid; }
.formulas > div {
  font-family: var(--note); font-size: calc(var(--u) * .96);
  padding: calc(var(--u) * .62) 0 calc(var(--u) * .62) calc(var(--u) * 1.1);
  border-bottom: 1px solid var(--rule); border-left: 2px solid var(--red);
  white-space: nowrap; overflow-x: auto;
}
.formulas > div:first-child { border-top: 1px solid var(--rule); }

/* ─── Ступени рынка: сужение как спуск ──────────────────────────────── */
.steps-in { display: grid; }
.steps-in > div { display: grid; grid-template-columns: calc(var(--u) * 3.6) auto 1fr;
  gap: calc(var(--u) * 1.1); align-items: baseline; padding: calc(var(--u) * .8) 0; border-bottom: 1px solid var(--rule); }
.steps-in > div:first-child { border-top: 1px solid var(--rule); }
.steps-in > div:nth-child(2) { margin-left: calc(var(--u) * 2.6); }
.steps-in > div:nth-child(3) { margin-left: calc(var(--u) * 5.2); border-bottom: 2px solid var(--red); }
.steps-in .k { font-family: var(--note); color: var(--ink-faint); }
.steps-in > div:nth-child(3) .k, .steps-in > div:nth-child(3) .fig { color: var(--red); }

/* ─── Таблица правды ──────────────────────────────────────────────────
   color: inherit обязателен. Без доктайпа браузер уходит в quirks mode,
   а там таблица не наследует цвет от предков: на чёрном листе строки
   «да» получали чернильный цвет и становились невидимыми. Опубликованный
   артефакт доктайп добавляет сам, но локальная копия и печать в PDF —
   нет, поэтому чиним в стилях, а не рассчитываем на обёртку. */
table { width: 100%; border-collapse: collapse; color: inherit; }
td { padding: calc(var(--u) * .62) calc(var(--u) * .7); border-bottom: 1px solid var(--rule);
  font-size: calc(var(--u) * .98); vertical-align: baseline; }
td:first-child { padding-left: 0; }
tr:first-child td { border-top: 1px solid var(--rule); }
td.claim { width: 44%; }
td.verdict { color: var(--ink-soft); font-family: var(--note); font-size: calc(var(--u) * .92); }
td.sign { width: 1%; text-align: right; font-family: var(--display); font-weight: 600; padding-right: 0; }
tr.no td.verdict, tr.no td.sign { color: var(--red); }
tr.no td.claim { color: var(--ink-soft); }

/* ─── Дорожная карта: горизонтальная шкала ──────────────────────────── */
.road { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * 1.9); }
.road > div { border-top: 2px solid var(--rule-hard); padding-top: calc(var(--u) * .8); }
.road > div.now { border-top-color: var(--red); }
.road h3 { margin-bottom: calc(var(--u) * .6); }
.road ul { list-style: none; }
.road li { font-size: calc(var(--u) * .94); line-height: 1.4; padding: calc(var(--u) * .26) 0; color: var(--ink-soft); }

/* ─── Управление ────────────────────────────────────────────────────── */
.controls {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px; padding: 9px 20px;
  background: var(--ink); border-top: 2px solid var(--red);
  font-family: var(--note); font-size: 13px; color: var(--stock);
}
.controls .sp { flex: 1; }
.controls .ct { color: #948d7d; }
.controls .ct b { color: var(--stock); font-weight: 700; font-variant-numeric: tabular-nums; }
.btn {
  background: none; border: 1px solid #4a4437; color: #c9c3b4; cursor: pointer;
  font-family: var(--note); font-size: 13px; padding: 4px 11px;
}
.btn:hover { color: var(--stock); border-color: #7d7768; }
.langs { display: flex; gap: -1px; }
.langs button { background: none; border: 1px solid #4a4437; margin-left: -1px; color: #c9c3b4;
  font-family: var(--note); font-size: 13px; padding: 4px 11px; cursor: pointer; }
.langs button.on { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* ─── Заметки докладчика ────────────────────────────────────────────── */
.notes {
  width: min(1280px, 96vw); margin: -18px auto 0; display: none;
  background: var(--stock-2); color: var(--ink);
  border-left: 3px solid var(--red); padding: 13px 18px;
  font-family: var(--text); font-size: 14px; line-height: 1.6;
}
.notes i { font-family: var(--note); font-style: normal; color: var(--red); font-weight: 700;
  display: block; font-size: 12px; margin-bottom: 4px; }
body.show-notes .notes { display: block; }

/* ─── Печать ────────────────────────────────────────────────────────── */
@page { size: 1280px 720px; margin: 0; }
@media print {
  .controls, .notes { display: none !important; }
  body { background: #fff; }
  .deck { gap: 0; padding: 0; }
  .sheet { width: 1280px; height: 720px; aspect-ratio: auto; break-after: page; --u: 13px; }
  .sheet, .sheet.rev { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="deck" id="deck"></div>

<div class="controls">
  <span class="ct"><b id="cur">01</b> / 12</span>
  <button class="btn" id="prev">←</button>
  <button class="btn" id="next">→</button>
  <span class="sp"></span>
  <button class="btn" id="notesBtn">Заметки</button>
  <button class="btn" id="printBtn">PDF</button>
  <div class="langs" id="langs"></div>
</div>

<script>
const esc = (s) => String(s).replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));

/* Разрешаем внутри строк только выделения, которыми набран сам дек. */
const rich = (s) => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
  .replace(/__(.+?)__/g, '<em>$1</em>')
  .replace(/~~(.+?)~~/g, '<span class="u">$1</span>');

const T = {
  ru: {
    langNote: 'Заметки · N',
    slides: [
      /* 01 ─────────────────────────────────────────────────────── */
      { cls: 'dark', kind: 'title',
        eyebrow: 'Питч-дек · 2026',
        h1: 'Репетитор, который сначала находит __причину__ пробела',
        lead: 'Адаптивная платформа для школьников Казахстана 7–11 классов. Находит настоящую тему, с которой посыпалось, строит маршрут до экзамена и работает без интернета.',
        chips: [],
        foot: '',
        notes: 'Первая фраза вслух, одно предложение: «AQYL находит настоящую причину пробела у школьника и доводит его до экзамена». Не начинайте с проблемы. Начните с того, ЧТО это. Дальше идут три слайда истории.'
      },
      /* 02 ─────────────────────────────────────────────────────── */
      { kind: 'story',
        eyebrow: 'Аружан, 9 класс',
        h2: 'Третий раз проваливает квадратные уравнения',
        body: [
          'Село в Туркестанской области. В классе 28 человек, у учителя нет физической возможности разобраться с каждым.',
          'Репетитор стоит 15 000 ₸ в месяц за один предмет. В семье трое детей.',
        ],
        kicker: 'Любая платформа, которую вы ей откроете, даст ей ещё десять квадратных уравнений.',
        foot: 'Собирательный портрет по данным о сельских школах РК · источники на слайде 04',
        notes: 'Замедлитесь. Это единственный момент дека про человека, а не про технологию. Не торопитесь к решению, дайте судье почувствовать тупик. Пауза перед «ещё десять квадратных уравнений».'
      },
      /* 03 ─────────────────────────────────────────────────────── */
      { cls: 'gold', kind: 'descend',
        eyebrow: 'Инсайт',
        h2: 'Аружан спотыкается не на квадратных уравнениях. Она теряет __минус__ перед скобкой.',
        steps: [
          { n: '3', t: 'Квадратные уравнения', pct: '21%', note: 'Симптом. Здесь обычная платформа остановится и выдаст ещё задач.' },
          { n: '2', t: 'Преобразование выражений', pct: '28%', note: 'Проверка предпосылки: раскрытие скобок, формулы сокращённого умножения.' },
          { n: '1', t: 'Знаки при раскрытии скобок', pct: '19%', note: 'Первопричина. В 4 ошибках из 5 теряется минус перед скобкой.', root: true },
        ],

      <div class="descent">
        ${s.steps.map((st, i) => `
          <div class="level d${i + 1}">
            <span class="lv">${esc(st.n)}</span>
            <div><div class="name">${esc(st.t)}</div><div class="why">${esc(st.note)}</div></div>
            <span class="pc">${esc(st.pct)}</span>
          </div>`).join('')}
      </div>
      <p class="lead" style="margin-top:calc(var(--u)*1.5)">${richH(s.kicker)}</p>
    </div>`,

  /* 04 — дефицит переехал. Слева довод, справа опись того, что продаёт репетитор. */
  twocol: (s) => `${head(s)}
    <div class="row g-wide-l grow">
      <div class="stack" style="gap:calc(var(--u)*.95);align-content:center">
        ${s.left.map(p => `<p>${richH(p)}</p>`).join('')}
      </div>
      <div style="align-self:center">
        <div class="note" style="margin-bottom:calc(var(--u)*.7)">${esc(s.rightTitle)}</div>
        <dl class="defs">
          ${s.rightList.map(([a, b], i) => `
            <div class="def${i >= 2 ? ' hit' : ''}"><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join('')}
        </dl>
      </div>
    </div>`,

  /* 05 — почему сейчас. Три такта по вертикальным линейкам, под ними цифра. */
  whynow: (s) => `${head(s)}
    <div class="row g-3 ruled" style="margin-bottom:calc(var(--u)*1.6)">
      ${s.cols.map((c, i) => `<div>
        <h3 style="${i === 2 ? 'color:var(--red)' : ''};margin-bottom:calc(var(--u)*.45)">${esc(c.k)}</h3>
        <p class="small">${esc(c.v)}</p></div>`).join('')}
    </div>
    <div class="row g-wide-l grow" style="align-items:center">
      <p class="lead">${richH(s.kicker)}</p>
      <div>
        <div class="fig fig-xl mark">${esc(s.stat.n)}</div>
        <p class="small" style="margin-top:calc(var(--u)*.6);max-width:34ch">${esc(s.stat.l)}</p>
        <div class="note" style="margin-top:calc(var(--u)*.4)">${esc(s.stat.s)}</div>
      </div>
    </div>`,

  /* 06 — масштаб. Четыре числа по линейкам; красным только то, что ведёт к офлайну. */
  figures: (s) => `${head(s)}
    <div class="row g-4 ruled grow">
      ${s.figs.map(f => `<div>
        <div class="fig fig-l${f.gold ? ' mark' : ''}">${esc(f.n)}</div>
        <p class="small" style="margin-top:calc(var(--u)*.7)">${esc(f.l)}</p>
        <div class="note" style="margin-top:calc(var(--u)*.5)">${esc(f.s)}</div></div>`).join('')}
    </div>`,

  /* 07 — продукт. Порядковые номера здесь заслужены: это последовательность. */
  product: (s) => `${head(s)}
    <div class="row g-2 grow" style="gap:calc(var(--u)*1.5) calc(var(--u)*2.6);align-content:center">
      ${s.items.map((it, i) => `<div style="border-top:1px solid ${i === 1 ? 'var(--red)' : 'var(--rule)'};padding-top:calc(var(--u)*.7)">
        <div style="display:flex;gap:calc(var(--u)*.8);align-items:baseline">
          <span class="note"${i === 1 ? ' style="color:var(--red)"' : ''}>${esc(it.n)}</span>
          <h3${i === 1 ? ' style="color:var(--red)"' : ''}>${esc(it.t)}</h3>
        </div>
        <p class="small" style="margin-top:calc(var(--u)*.4)">${esc(it.d)}</p></div>`).join('')}
    </div>`,

  /* 08 — механика. Довод слева, формулы справа на линованных строках. */
  graph: (s) => `${head(s)}
    <div class="row g-wide-l grow" style="align-items:center">
      <div class="stack" style="gap:calc(var(--u)*.85)">
        ${s.points.map(p => `<p class="small" style="font-size:calc(var(--u)*1)">${richH(p[0])}</p>`).join('')}
      </div>
      <div class="formulas">${s.formulas.map(f => `<div>${esc(f)}</div>`).join('')}</div>
    </div>
    <p class="small" style="margin-top:calc(var(--u)*1.1);border-top:1px solid var(--rule);padding-top:calc(var(--u)*.8)">${richH(s.kicker)}</p>`,

  /* 09 — модели. Три колонки по линейкам, параметры мелко под текстом. */
  models: (s) => `${head(s)}
    <div class="row g-3 ruled grow">
      ${s.models.map(m => `<div>
        <h3 style="margin-bottom:calc(var(--u)*.5)">${esc(m.t)}</h3>
        <p class="small">${esc(m.d)}</p>
        <div class="note" style="margin-top:calc(var(--u)*.7);border-top:1px solid var(--rule);padding-top:calc(var(--u)*.4)">${esc(m.p)}</div></div>`).join('')}
    </div>
    <p style="margin-top:calc(var(--u)*1.1)">${richH(s.kicker)}</p>`,

  /* 10 — веса. Слагаемые набраны строкой, а не пилюлями. */
  explain: (s) => `${head(s)}
    <p class="lead" style="margin-bottom:calc(var(--u)*1.4)">${esc(s.lead)}</p>
    <div class="row g-wide-l grow" style="align-items:center">
      <div>
        <h3 style="margin-bottom:calc(var(--u)*.55)">${esc(s.demoTitle)}</h3>
        <div class="weights">
          ${s.tags.map(([t, w]) => `<span>${esc(t)} <b>${esc(w)}</b></span>`).join('<span class="sep">/</span>')}
        </div>
        <div class="meter" style="margin-top:calc(var(--u)*.9)"><i style="width:21%"></i></div>
      </div>
      <dl class="defs">
        ${s.right.map(([a, b], i) => `<div class="def${i ? ' hit' : ''}" style="grid-template-columns:1fr">
          <dt style="font-weight:700">${esc(a)}</dt>
          <dd style="text-align:left;white-space:normal;margin-top:calc(var(--u)*.2)">${esc(b)}</dd></div>`).join('')}
      </dl>
    </div>`,

  /* 11 — юнит-экономика. Две колонки, вывод крупно снизу. */
  unit: (s) => `${head(s)}
    <div class="row g-2 ruled grow">
      ${s.cols.map(c => `<div>
        <h3 style="margin-bottom:calc(var(--u)*.5)">${esc(c.k)}</h3>
        <p class="small">${esc(c.v)}</p></div>`).join('')}
    </div>
    <p class="lead" style="margin-top:calc(var(--u)*1.2);border-top:2px solid var(--red);padding-top:calc(var(--u)*.9)">${richH(s.kicker)}</p>`,

  /* 12 — язык. Три числа, довод, и указание на сам дек как на доказательство. */
  lang: (s) => `${head(s)}
    <p class="lead">${esc(s.lead)}</p>
    <div class="row g-3 ruled" style="margin:calc(var(--u)*1.5) 0">
      ${s.stats.map(([n, l]) => `<div>
        <div class="fig fig-m mark">${esc(n)}</div>
        <p class="small" style="margin-top:calc(var(--u)*.45)">${esc(l)}</p></div>`).join('')}
    </div>
    <div class="grow"><p class="small">${esc(s.kicker)}</p></div>
    <p class="margin-note" style="border-top:1px solid var(--rule);padding-top:calc(var(--u)*.7)">${esc(s.proof)}</p>`,

  /* 13 — учитель. Три колонки, затем поворот к деньгам. */
  teacher: (s) => `${head(s)}
    <p class="lead" style="margin-bottom:calc(var(--u)*1.3)">${esc(s.lead)}</p>
    <div class="row g-3 ruled grow">
      ${s.items.map(([t, d]) => `<div>
        <h3 style="margin-bottom:calc(var(--u)*.45)">${esc(t)}</h3>
        <p class="small">${esc(d)}</p></div>`).join('')}
    </div>
    <p style="margin-top:calc(var(--u)*1.1);font-family:var(--display);font-weight:500;text-transform:uppercase;font-size:calc(var(--u)*1.9);line-height:1.05">${richH(s.kicker)}</p>`,

  /* 14 — тарифы. Прайс-лист по линованным строкам, платный уровень отмечен. */
  model: (s) => `${head(s)}
    <div class="grow" style="justify-content:center">
      <div class="lines">
        ${s.tiers.map(t => `<div class="row" style="grid-template-columns:5fr 3fr 9fr;gap:calc(var(--u)*1.4);align-items:baseline">
          <h3${t.hot ? ' style="color:var(--red)"' : ''}>${esc(t.t)}</h3>
          <div class="fig fig-m${t.hot ? ' mark' : ''}" style="font-size:calc(var(--u)*1.5)">${esc(t.p)}</div>
          <p class="small">${esc(t.d)}</p></div>`).join('')}
      </div>
    </div>
    <p style="margin-top:calc(var(--u)*1)">${richH(s.kicker)}</p>`,

  /* 15 — рынок. Ступени сужаются вправо тем же жестом, что и спуск на 03. */
  market: (s) => `${head(s)}
    <div class="row g-wide-l grow" style="align-items:center">
      <div class="steps-in">
        ${s.tam.map(t => `<div>
          <span class="k">${esc(t.k)}</span>
          <span class="fig fig-m">${esc(t.n)}</span>
          <span class="small">${esc(t.d)}</span></div>`).join('')}
      </div>
      <div class="stack" style="gap:calc(var(--u)*1.3)">
        ${s.side.map(([n, l]) => `<div>
          <div class="fig fig-m mark">${esc(n)}</div>
          <p class="small" style="margin-top:calc(var(--u)*.35)">${esc(l)}</p></div>`).join('')}
      </div>
    </div>
    <p style="margin-top:calc(var(--u)*.9)">${richH(s.kicker)}</p>`,

  /* 16 — что правда. Красным отмечено ровно то, чего у нас пока нет. */
  honest: (s) => `${head(s)}
    <div class="grow" style="justify-content:center">
      <table>${s.rows.map(([a, b, k]) => `
        <tr class="${k}"><td class="claim">${esc(a)}</td><td class="verdict">${esc(b)}</td>
        <td class="sign">${k === 'yes' ? '✓' : '—'}</td></tr>`).join('')}</table>
    </div>
    <p style="margin-top:calc(var(--u)*1)">${richH(s.kicker)}</p>`,

  /* 17 — карта и запрос. Шкала сверху, запрос под красной чертой. */
  road: (s) => `${head(s)}
    <div class="road grow" style="align-content:start">
      ${s.road.map(r => `<div class="${r.now ? 'now' : ''}">
        <h3${r.now ? ' style="color:var(--red)"' : ''}>${esc(r.k)}</h3>
        <ul>${r.li.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}
    </div>
    <div style="border-top:2px solid var(--red);padding-top:calc(var(--u)*.9);margin-top:calc(var(--u)*1)">
      <p class="lead" style="max-width:none">${esc(s.ask)}</p>
      <p class="small" style="margin-top:calc(var(--u)*.4)">${esc(s.askSub)}</p>
    </div>`,

  /* 18 — финал. Возврат к третьему слайду и контакты мелко. */
  close: (s) => `
    <div class="head"><div class="rubric">${esc(s.eyebrow)}</div></div>
    <div class="grow">
      <h2 style="font-size:calc(var(--u)*3.6);max-width:25ch">${richH(s.h2)}</h2>
    </div>
    <div style="border-top:1px solid var(--rule);padding-top:calc(var(--u)*.8)">
      <p class="note-b" style="font-size:calc(var(--u)*1.05)">${esc(s.team)}</p>
      <p class="margin-note" style="margin-top:calc(var(--u)*.3)">${esc(s.teamHint)}</p>
      <p class="note" style="margin-top:calc(var(--u)*.8)">
        ${s.links.map(esc).join(' <span style="color:var(--red)">·</span> ')}</p>
    </div>`,
};

/* Язык можно задать ссылкой: ?lang=kk. Нужно и для печати трёх PDF,
   и чтобы можно было отправить жюри сразу английскую версию. */
const askedLang = new URLSearchParams(location.search).get('lang');
let lang = ['ru', 'kk', 'en'].includes(askedLang) ? askedLang : 'ru';
const deckEl = document.getElementById('deck');

/* 12-слайдовая версия: индексы оставленных слайдов исходного дека (18 → 12).
   Вырезаны 04, 05, 08, 10, 12, 15 — они уходят в запасные слайды для Q&A. */
const KEEP = [0, 1, 2, 5, 6, 8, 10, 12, 13, 15, 16, 17];

function render() {
  const slides = KEEP.map(i => T[lang].slides[i]);
  deckEl.innerHTML = slides.map((s, i) => `
    <section class="sheet ${s.cls ? 'rev' : ''}" id="s${i}">
      ${R[s.kind](s)}
      <div class="colophon">
        <span class="plate">${String(i + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}</span>
        <span>${esc(s.foot || '')}</span>
        <span class="sp"></span>
        <span>AQYL</span>
      </div>
    </section>
    <div class="notes"><i>${esc(T[lang].langNote)}</i>${esc(s.notes)}</div>`).join('');
  document.getElementById('notesBtn').textContent = T[lang].langNote;
  document.documentElement.lang = lang;
}

const LANGS = [['kk', 'ҚАЗ'], ['ru', 'РУС'], ['en', 'ENG']];
const langsEl = document.getElementById('langs');
function paintLangs() {
  langsEl.innerHTML = LANGS.map(([id, l]) =>
    `<button data-l="${id}" class="${lang === id ? 'on' : ''}" aria-pressed="${lang === id}">${l}</button>`).join('');
}
langsEl.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const keep = current();
  lang = b.dataset.l; paintLangs(); render(); go(keep);
});

function current() {
  const tops = [...document.querySelectorAll('.sheet')].map(el => Math.abs(el.getBoundingClientRect().top - 30));
  return tops.indexOf(Math.min(...tops));
}
function go(i) {
  const els = document.querySelectorAll('.sheet');
  const n = Math.max(0, Math.min(els.length - 1, i));
  els[n].scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('cur').textContent = String(n + 1).padStart(2, '0');
}
document.getElementById('next').onclick = () => go(current() + 1);
document.getElementById('prev').onclick = () => go(current() - 1);
document.getElementById('printBtn').onclick = () => window.print();
document.getElementById('notesBtn').onclick = () => document.body.classList.toggle('show-notes');

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'BUTTON' && e.key === ' ') return;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(current() + 1); }
  if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(current() - 1); }
  if (['n', 'N', 'т', 'Т'].includes(e.key)) document.body.classList.toggle('show-notes');
  if (e.key === 'Home') go(0);
  if (e.key === 'End') go(document.querySelectorAll('.sheet').length - 1);
});
addEventListener('scroll', () => {
  document.getElementById('cur').textContent = String(current() + 1).padStart(2, '0');
}, { passive: true });

paintLangs();
render();
</script>
